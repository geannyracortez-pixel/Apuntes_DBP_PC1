spring.application.name=eventpass

# Puerto donde corre la API -> http://localhost:8080
server.port=8080

# Base de datos H2 en memoria (se borra al apagar la aplicacion)
spring.datasource.url=jdbc:h2:mem:eventpassdb
spring.datasource.username=sa
spring.datasource.password=

# JPA crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que se ejecuta (util para aprender)
spring.jpa.show-sql=true

# JWT: clave secreta para firmar (minimo 32 caracteres) y duracion en milisegundos (1 hora)
jwt.secret=eventpass-utec-clave-secreta-super-larga-2026
jwt.expiration=3600000
